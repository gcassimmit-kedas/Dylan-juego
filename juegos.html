<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1d2416" />
  <meta name="description" content="Juegos incluidos en Shooter 2027: el shooter de oleadas y Tres en Raya 3D." />
  <title>Más juegos</title>
  <link rel="icon" type="image/svg+xml" href="./icons/emblema.svg" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="/src/ui/fonts.css" />
  <style>
    :root { --bg: #1d2416; --card: #262d1f; --line: #4d5a3a; --text: #f4f1e4; --muted: #c4c2a8; --accent: #ffc83d; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 50% 30%, #33411f, var(--bg) 70%); color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
      padding: calc(env(safe-area-inset-top) + 24px) 16px calc(env(safe-area-inset-bottom) + 24px); }
    .logo { width: 108px; height: 108px; }
    h1 { margin: 0; font-family: 'Oswald', sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; font-size: clamp(2rem, 7vw, 3rem); }
    .games { display: grid; gap: 12px; width: min(100%, 440px); }
    .game { display: flex; align-items: center; gap: 14px; text-decoration: none; color: inherit; background: linear-gradient(180deg, #2a3420, var(--card));
      border: 1px solid var(--line); padding: 16px 18px; clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
    .game:active { transform: scale(0.98); }
    .game .ic { width: 36px; height: 36px; flex: none; color: var(--accent); }
    .game .chev { width: 22px; height: 22px; color: var(--muted); flex: none; }
    .game div { flex: 1; }
    .game strong { display: block; font-family: 'Oswald', sans-serif; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; font-size: 1.35rem; margin-bottom: 2px; }
    .game span { color: var(--muted); font-size: 0.92rem; }
    .tres .ic { color: #ff7a8a; }
    footer { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
    footer a { color: var(--muted); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; font-size: 0.9rem; padding: 6px 2px; }
    footer svg { width: 16px; height: 16px; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <img class="logo" src="./icons/emblema.svg" alt="" />
  <h1>Más juegos</h1>
  <nav class="games" aria-label="Juegos">
    <a class="game shooter" href="./index.html">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /><line x1="22" x2="18" y1="12" y2="12" /><line x1="6" x2="2" y1="12" y2="12" /><line x1="12" x2="12" y1="6" y2="2" /><line x1="12" x2="12" y1="22" y2="18" /></svg>
      <div><strong>Shooter 2027</strong><span>Shooter de oleadas contra robots, con tienda de armas y equipo.</span></div>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
    </a>
    <a class="game tres" href="./tres-en-raya.html">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2" /><path d="M3 9h18" /><path d="M3 15h18" /><path d="M9 3v18" /><path d="M15 3v18" /></svg>
      <div><strong>Tres en Raya 3D</strong><span>Alinea 4 en un cubo, contra la CPU o un amigo.</span></div>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
    </a>
  </nav>
  <footer>
    <a href="./privacidad.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z" /><path d="M14 2v5a1 1 0 0 0 1 1h5" /><path d="M10 9H8" /><path d="M16 13H8" /><path d="M16 17H8" /></svg>Privacidad</a>
    <a href="./creditos.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /><path d="M12 16v-4" /><path d="M12 8h.01" /></svg>Créditos y licencias</a>
  </footer>
</body>
</html>
