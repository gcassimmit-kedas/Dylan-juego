<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1222" />
  <title>Tres en Raya 3D</title>
  <link rel="stylesheet" href="/src/tres/style.css" />
</head>
<body>
  <canvas id="scene"></canvas>
  <header id="hud">
    <div class="left"><a href="./index.html" id="menu" aria-label="Menú">☰</a><div id="status" aria-live="polite">Turno de X</div></div>
    <div id="controls">
      <select id="size" aria-label="Tamaño">
        <option value="4" selected>4×4×4</option>
        <option value="3">3×3×3</option>
      </select>
      <select id="mode" aria-label="Modo">
        <option value="cpu-dificil" selected>vs CPU (difícil)</option>
        <option value="cpu-facil">vs CPU (fácil)</option>
        <option value="2p">2 jugadores</option>
      </select>
      <button id="restart">Nueva partida</button>
    </div>
  </header>
  <div id="layers" aria-label="Separación de capas">
    <label>Separar capas <input id="spread" type="range" min="0" max="1" step="0.01" value="0.45" /></label>
  </div>
  <script type="module" src="/src/tres/main.ts"></script>
</body>
</html>
