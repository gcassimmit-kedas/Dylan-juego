<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1222" />
  <link rel="icon" type="image/svg+xml" href="./icons/emblema.svg" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="/src/ui/fonts.css" />
  <title>Tres en Raya 3D</title>
  <link rel="stylesheet" href="/src/tres/style.css" />
</head>
<body>
  <canvas id="scene"></canvas>
  <header id="hud">
    <div class="left"><a href="./juegos.html" id="menu" aria-label="Volver a la lista de juegos"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></a><div id="status" aria-live="polite">Turno de X</div></div>
    <div id="controls">
      <select id="size" aria-label="Tamaño">
        <option value="4" selected>4×4×4</option>
        <option value="3">3×3×3</option>
      </select>
      <select id="mode" aria-label="Modo">
        <option value="cpu-dificil" selected>CPU difícil</option>
        <option value="cpu-facil">CPU fácil</option>
        <option value="2p">2 jugadores</option>
      </select>
      <button id="restart">Nueva partida</button>
    </div>
  </header>
  <div id="layers" aria-label="Separación de capas">
    <label>Separar capas <input id="spread" type="range" min="0" max="1" step="0.01" value="0.45" /></label>
  </div>
  <script type="module" src="/src/tres/main.ts"></script>
  <script type="module" src="/src/ui/pwa.ts"></script>
</body>
</html>
