<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#7ec3ec" />
  <title>Frente de Batalla</title>
  <link rel="stylesheet" href="/src/shooter/style.css" />
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="hud">
    <div class="left">
      <a href="./index.html" class="btn" aria-label="Menú">☰</a>
      <div id="hp" class="chip" aria-label="Vida"></div>
      <button id="roomChip" class="chip mp-only" title="Toca para copiar el código"></button>
    </div>
    <div class="right">
      <div id="wave" class="chip">Oleada 1</div>
      <div id="coins" class="chip">🪙 0</div>
      <div id="score" class="chip">0</div>
      <button id="mute" class="btn" aria-label="Sonido">🔊</button>
    </div>
  </div>
  <div id="players" class="mp-only" aria-label="Jugadores"></div>
  <div id="rapid" hidden>⚡ DISPARO RÁPIDO</div>
  <div id="banner"></div>
  <div id="toolbar"><div id="weapons"></div></div>
  <div id="tools" aria-label="Equipo"></div>
  <div class="stick" id="stickL"><div class="knob"></div></div>
  <div class="stick" id="stickR"><div class="knob"></div></div>

  <div id="shop" hidden>
    <div class="panel">
      <h2 id="shopTitle">Tienda</h2>
      <p id="shopSub"></p>
      <div class="wallet">🪙 <span id="shopCoins">0</span></div>
      <p id="shopTimer" hidden></p>
      <div id="shopBody"></div>
      <button id="nextWave" class="primary">Siguiente oleada ▶</button>
    </div>
  </div>

  <div id="overlay">
    <h1 id="overlayTitle">Frente de Batalla</h1>
    <p id="overlayMsg"></p>
    <div class="menu">
      <button id="play" class="primary">Un jugador</button>
      <button id="multiBtn" class="primary alt">Multijugador</button>
      <button id="leaveBtn" class="primary alt" hidden>Salir al menú</button>
    </div>
    <p class="help" id="help"></p>
  </div>

  <div id="lobby" hidden>
    <div class="panel">
      <h2>Multijugador</h2>
      <p id="lobbyStatus"></p>
      <label class="field">Tu nombre <input id="nick" maxlength="16" placeholder="Soldado" autocomplete="nickname" /></label>
      <button id="joinMain" class="primary">🌍 Entrar al servidor público</button>

      <h3>Salas públicas <button id="refreshRooms" class="mini" aria-label="Actualizar">↻</button></h3>
      <div id="roomList"></div>

      <h3>Crear sala</h3>
      <div class="row">
        <input id="roomName" maxlength="16" placeholder="Nombre de la sala" />
        <label class="check"><input type="checkbox" id="privateRoom" /> Privada</label>
        <button id="createRoom">Crear</button>
      </div>
      <small class="hint">Las salas privadas no salen en la lista: se entra con un código de 5 letras.</small>

      <h3>Unirse con código</h3>
      <div class="row">
        <input id="code" maxlength="5" placeholder="ABCDE" autocapitalize="characters" autocomplete="off" />
        <button id="joinCode">Unirse</button>
      </div>

      <button id="lobbyBack" class="back">← Volver</button>
    </div>
  </div>
  <script type="module" src="/src/shooter/main.ts"></script>
</body>
</html>
