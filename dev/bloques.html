<!doctype html>
<html lang="es">
<head><meta charset="UTF-8" /><title>Bloques: hoja de pruebas</title><style>html,body{margin:0;height:100%;background:#1d2416}canvas{display:block;width:100%;height:100%}</style></head>
<body>
<canvas id="c"></canvas>
<script type="module">
// Hoja de pruebas de Bloques: los robots de la noche a su escala junto a un jugador (1,8 bloques),
// y una construcción pequeña con losas y plantas dibujada con el mismo mallador que el juego.
import * as THREE from 'three';
import { makeRobot, animateRobot } from '/src/shooter/models.ts';
import { makePerson } from '/src/bloques/models.ts';
import { World, B, BLOCKS } from '/src/bloques/voxel.ts';
import { meshChunk } from '/src/bloques/mesher.ts';
import { buildAtlas } from '/src/bloques/textures.ts';
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9fc6e8);
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100); camera.position.set(0, 3.4, 9.5); camera.lookAt(0, 0.8, -1.5);
scene.add(new THREE.HemisphereLight(0xffffff, 0x556040, 1.2)); const sun = new THREE.DirectionalLight(0xffffff, 2); sun.position.set(3, 6, 5); scene.add(sun);
const grid = new THREE.GridHelper(10, 10, 0x334422, 0x556644); scene.add(grid);
const SCALE = { escudero: 0.95, tirador: 0.85, chaser: 1.1 };
const robots = Object.entries(SCALE).map(([type, s], i) => { const r = makeRobot(type); r.root.scale.setScalar(s); const g = new THREE.Group(); g.add(r.root); g.position.x = -3 + i * 2; g.rotation.y = 0.5; scene.add(g); return r; });
const person = makePerson({ skin: 0xb5683c, hair: 0x1a1210, shirt: 0xeeeeee, pants: 0x22262c, shoes: 0x111111, curly: false, stripes: false, sleeves: true, collar: true, wide: 1 });
person.root.position.x = 3; person.root.rotation.y = -0.4; scene.add(person.root);
// Construcción de muestra: suelo de hierba, escalera de losas hasta un bloque, losas de piedra y plantas
const atlas = buildAtlas([...new Set(BLOCKS.flatMap((b) => b.tex))]);
const w = World.empty(1);
for (let x = 0; x < 8; x++) for (let z = 0; z < 4; z++) w.set(x, 0, z, B.Hierba);
w.set(1, 1, 1, B.LosaTablas); w.set(2, 1, 1, B.Tablas); w.set(3, 1, 1, B.Tablas); w.set(3, 2, 1, B.LosaTablas);
w.set(5, 1, 1, B.LosaPiedra); w.set(6, 1, 1, B.LosaPiedra); w.set(6, 1, 2, B.Adoquin);
w.set(0, 1, 3, B.HierbaAlta); w.set(1, 1, 3, B.FlorSol); w.set(2, 1, 3, B.FlorFuego); w.set(4, 1, 3, B.ArbustoBayas);
const built = meshChunk(w, 0, 0, (t) => atlas.uv(t));
for (const [d, see] of [[built.solid, false], [built.see, true]]) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(d.pos, 3)); g.setAttribute('normal', new THREE.Float32BufferAttribute(d.nrm, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(d.uv, 2)); g.setAttribute('color', new THREE.Float32BufferAttribute(d.col, 3)); g.setIndex(d.idx);
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ map: atlas.map, vertexColors: true, alphaTest: see ? 0.5 : 0, side: see ? THREE.DoubleSide : THREE.FrontSide }));
  m.position.set(-4, -1, -6); scene.add(m);
}
let d = 0;
function frame(t) {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  d += 0.03;
  for (const r of robots) { animateRobot(r, 0, d, 0, d + 1, 1 / 60, t / 1000, false); r.root.position.set(0, 0, 0); }
  renderer.render(scene, camera); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
