# Brasas: un solo Worker con Static Assets (el juego), Durable Objects (salas) y D1 (guardado).
name = "brasas"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "../public/brasas"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[observability]
enabled = true

[[durable_objects.bindings]]
name = "SALAS"
class_name = "Sala"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Sala"]

[[d1_databases]]
binding = "DB"
database_name = "brasas"
# Antes de desplegar: pega aquí el "database_id" que imprime `npx wrangler d1 create brasas`.
# En local (wrangler dev) no hace falta: se usa una base de datos de prueba en .wrangler/.
database_id = "PEGA-AQUI-EL-ID-DE-D1"
migrations_dir = "migrations"

# Límite de creación de cuentas por IP (10 por minuto). "namespace_id" lo eliges tú:
# cualquier número entero que no uses ya en otro limitador de tu cuenta.
[[ratelimits]]
name = "LIMITE_CUENTAS"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
