<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d1a" />
  <title>Juegos de Dylan</title>
  <style>
    :root { --bg: #0b0d1a; --card: #161a36; --text: #eef0ff; --muted: #9aa0c7; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
      padding: calc(env(safe-area-inset-top) + 24px) 16px calc(env(safe-area-inset-bottom) + 24px); }
    h1 { margin: 0; font-size: clamp(1.8rem, 6vw, 2.6rem); }
    .games { display: grid; gap: 14px; width: min(100%, 420px); }
    a { display: block; text-decoration: none; color: inherit; background: var(--card); border: 1px solid #2c3366; border-radius: 16px; padding: 18px 20px; }
    a:active { transform: scale(0.98); }
    a strong { display: block; font-size: 1.3rem; margin-bottom: 4px; }
    a span { color: var(--muted); }
    .shooter strong { color: #ffc83d; } .tres strong { color: #ff5d73; }
  </style>
</head>
<body>
  <h1>Juegos de Dylan</h1>
  <nav class="games">
    <a class="shooter" href="./shooter.html"><strong>Frente de Batalla</strong><span>Shooter de oleadas en un campo de batalla, con tienda de armas.</span></a>
    <a class="tres" href="./tres-en-raya.html"><strong>Tres en Raya 3D</strong><span>Alinea 4 en un cubo, contra la CPU o un amigo.</span></a>
  </nav>
</body>
</html>
